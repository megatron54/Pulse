name: pulse-backend

# PostgreSQL propio para las tablas de dominio de Pulse (readiness_log,
# body_measurements, garmin_daily_metrics, etc. - ver
# docs/01-arquitectura/03-modelo-datos.md). Deliberadamente SEPARADO de
# la base de datos interna de wger (wger-docker/): evita acoplar nuestro
# esquema al de wger y sus futuras migraciones, y permite actualizar
# wger-docker/ (git pull) sin ningún riesgo de romper nuestros datos.
services:
  db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse_dev_password
      POSTGRES_DB: pulse
    volumes:
      - pulse-postgres-data:/var/lib/postgresql/data/
    ports:
      # Puerto distinto al de wger (que ni siquiera publica el suyo al
      # host) para evitar cualquier confusión al conectar herramientas.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pulse-postgres-data:
