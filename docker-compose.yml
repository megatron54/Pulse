name: pulse

# Empaquetado único del stack PROPIO de Pulse (Fase J del plan autónomo,
# ver docs/02-roadmap/02-plan-autonomo.md): Postgres + backend + frontend
# levantados con un solo comando. wger (backend/infra/wger-docker/) sigue
# siendo un stack SEPARADO a propósito (ver decisión de arquitectura en
# docs/01-arquitectura/01-arquitectura-general.md) y se levanta aparte.
#
# Uso:
#   cp .env.example .env   # y rellenar GEMINI_API_KEY / PULSE_API_KEY
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_dev_password}
      POSTGRES_DB: pulse
    volumes:
      - pulse-postgres-data:/var/lib/postgresql/data/
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://pulse:${POSTGRES_PASSWORD:-pulse_dev_password}@db:5432/pulse
      PULSE_ENV: ${PULSE_ENV:-dev}
      PULSE_API_KEY: ${PULSE_API_KEY:-}
      PULSE_FRONTEND_ORIGIN: ${PULSE_FRONTEND_ORIGIN:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pulse-postgres-data:
