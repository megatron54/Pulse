name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_dev_password
          POSTGRES_DB: pulse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://pulse:pulse_dev_password@localhost:5433/pulse
        run: |
          pytest --cov=engine --cov=services --cov=repositories --cov=coach \
                 --cov=api --cov=models --cov=garmin_sync --cov=scheduler \
                 --cov=wger_client \
                 --cov-report=term-missing --cov-fail-under=85

      - name: Verify schema against real Postgres (create/drop/create)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://pulse:pulse_dev_password@localhost:5433/pulse
        run: |
          python -c "
          from models.database import create_pulse_engine
          from models.schema import Base
          engine = create_pulse_engine()
          Base.metadata.create_all(engine)
          Base.metadata.drop_all(engine)
          Base.metadata.create_all(engine)
          print('OK: schema verified against real Postgres')
          "

      - name: Start API and check /health against real Postgres
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://pulse:pulse_dev_password@localhost:5433/pulse
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/health

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build (type-check + production build)
        working-directory: frontend
        run: npm run build

  docker-compose-smoke-test:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el stack completo (Postgres+backend+frontend) desde cero
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-smoke-test-only/' .env
          # --wait usa los HEALTHCHECK nativos de cada servicio (Postgres,
          # backend y frontend los tienen) en vez de un loop manual frágil
          # y dependiente de la forma exacta del JSON de `compose ps`.
          docker compose up -d --build --wait --wait-timeout 120
          docker compose ps

      - name: Regresión - crear un usuario real contra el stack recién levantado
        # Regresión del hallazgo real de Fase J: un Postgres NUEVO (volumen
        # recién creado) se quedaba sin tablas y este request fallaba con
        # UndefinedTable (ver backend/scripts/ensure_schema.py). Se imprime
        # el body de la respuesta en caso de fallo para distinguir esa
        # regresión de un 422 por un cambio de contrato de la API.
        run: |
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/users \
            -H "Content-Type: application/json" \
            -d '{"nombre":"CISmokeTest","altura_cm":180,"fecha_nacimiento":"1995-01-01","sexo":"M","fase_peso_actual":"maintenance"}' \
            -w "\nHTTP %{http_code}\n" \
            --fail-with-body

      - name: Frontend responde 200
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          echo "HTTP $codigo"
          [ "$codigo" = "200" ]

      - name: Logs (siempre, para depurar si algo falla)
        if: always()
        run: docker compose logs

      - name: Apagar el stack
        if: always()
        run: docker compose down -v
